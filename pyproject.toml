[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fit2csv"
version = "0.1.0"
description = "Convert FIT activity files to CSV and TCX formats and generate PNG files with telemetry widgets for use as a video overlay"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fitparse>=1.2.0",
    "lxml>=4.9.0",
    "Pillow>=9.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.uv]
managed = true

[tool.hatch.build.targets.wheel]
packages = ["."]
